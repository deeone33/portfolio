<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin — Fieldnote</title>
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('fieldnote_theme') || 'light');</script>
<link rel="stylesheet" href="assets/styles.css?v3">
<style>
  .wrap{max-width:1040px;}
  .stat-row{ display:grid; grid-template-columns:repeat(auto-fit, minmax(140px,1fr)); gap:10px; margin:18px 0 22px; }
  .stat-card{ border:1px solid var(--hair); border-radius:12px; padding:14px 16px; background:var(--ink2); }
  .stat-card .num{ font-size:22px; font-weight:800; }
  .stat-card .lbl{ font-size:11.5px; color:var(--mute); font-weight:600; text-transform:uppercase; letter-spacing:.03em; margin-top:2px; }

  .tab-row{ display:flex; gap:6px; margin-bottom:18px; border-bottom:1px solid var(--hair); }
  .tab-row button{ padding:10px 16px; border:none; background:none; font-size:13.5px; font-weight:700; cursor:pointer; color:var(--mute); border-bottom:2px solid transparent; margin-bottom:-1px; }
  .tab-row button.on{ color:var(--paper); border-bottom-color:var(--coral); }
  .tab-panel{ display:none; }
  .tab-panel.on{ display:block; }

  .order-card{border:1px solid var(--hair); border-radius:12px; padding:16px 18px; margin-bottom:12px; background:var(--ink2);}
  .order-top{display:flex; justify-content:space-between; align-items:flex-start; gap:14px;}
  .order-top h3{font-size:15.5px; font-weight:700;}
  .order-meta{font-size:12px; color:var(--mute); margin-top:3px;}
  .status-select{padding:6px 10px; border-radius:8px; border:1px solid var(--hair); font-size:12.5px; font-family:inherit; background:#fff; color:var(--paper);}
  [data-theme="dark"] .status-select{background:var(--ink); color:var(--paper);}
  .order-detail-toggle{ font-size:12px; font-weight:700; color:var(--coral); cursor:pointer; margin-top:8px; display:inline-block; }
  .order-detail{ display:none; margin-top:12px; padding-top:12px; border-top:1px solid var(--hair); }
  .order-detail.open{ display:block; }
  .file-row{display:flex; justify-content:space-between; align-items:center; padding:7px 10px; background:#fff; color:var(--paper); border:1px solid var(--hair); border-radius:7px; margin-top:6px; font-size:12.5px;}
  [data-theme="dark"] .file-row{background:var(--ink); color:var(--paper);}
  .upload-row{display:flex; gap:8px; margin-top:8px; align-items:center;}
  .comment{padding:8px 0; border-top:1px solid var(--hair); font-size:13px;}
  .comment .who{font-weight:700; font-size:11.5px; color:var(--mute); margin-bottom:2px;}
  .comment-box{display:flex; gap:8px; margin-top:10px;}
  .comment-box input{flex:1;}
  .filter-bar{display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap;}
  .filter-bar button{padding:6px 12px; border-radius:100px; border:1px solid var(--hair); background:#fff; color:var(--paper); font-size:12px; cursor:pointer; font-weight:600;}
  [data-theme="dark"] .filter-bar button{background:var(--ink); color:var(--paper);}
  .filter-bar button.on{background:var(--paper); color:var(--ink); border-color:var(--paper);}
  .range-btn{padding:7px 14px; border-radius:100px; border:1px solid var(--hair); background:#fff; font-size:12.5px; cursor:pointer; font-weight:600; color:var(--paper);}
  [data-theme="dark"] .range-btn{background:var(--ink);}
  .range-btn.on{background:var(--coral); color:var(--oncoral); border-color:var(--coral);}

  .top-pages-row{ display:flex; justify-content:space-between; padding:9px 0; border-top:1px solid var(--hair); font-size:13.5px; }
  .login-row{ display:flex; justify-content:space-between; padding:9px 0; border-top:1px solid var(--hair); font-size:13px; }
  .login-row .who{ font-weight:600; }
  .login-row .when{ color:var(--mute); font-size:12px; }
  .scroll-bar-track{ background:var(--hair); border-radius:100px; height:6px; width:120px; overflow:hidden; }
  .scroll-bar-fill{ background:var(--coral); height:100%; }
  .analytics-card{ border:1px solid var(--hair); border-radius:12px; padding:18px 20px; background:var(--ink2); margin-bottom:16px; }
  .analytics-card h3{ font-size:14.5px; font-weight:700; margin-bottom:4px; }
  .analytics-empty{ font-size:12.5px; color:var(--mute); padding:14px 0; }
</style>
</head>
<body>
<div id="site-header"></div>

<div class="wrap" style="padding-bottom:70px;">
  <section class="page-hero" style="padding-bottom:0;">
    <div class="eyebrow">Staff only</div>
    <h1>Backoffice</h1>
  </section>

  <div class="stat-row" id="statRow"></div>

  <div class="tab-row">
    <button data-tab="orders" class="on">Orders</button>
    <button data-tab="analytics">Analytics</button>
    <button data-tab="chat">Chat <span id="chatBadge" style="display:none; background:var(--admin); color:#fff; border-radius:100px; font-size:10px; font-weight:700; padding:2px 6px; margin-left:4px;"></span></button>
    <button data-tab="inbox">Inbox</button>
  </div>

  <div class="tab-panel on" id="panel-orders">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
      <div class="filter-bar" id="filterBar" style="margin-bottom:0;"></div>
      <button class="btn-secondary" id="exportOrdersBtn">Export CSV</button>
    </div>
    <div id="ordersList"></div>
  </div>

  <div class="tab-panel" id="panel-analytics">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
      <div style="display:flex; gap:6px;">
        <button class="range-btn" data-days="7">7 days</button>
        <button class="range-btn on" data-days="30">30 days</button>
        <button class="range-btn" data-days="90">90 days</button>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="btn-secondary" id="exportAnalyticsBtn">Export CSV</button>
        <button id="resetAnalyticsBtn" style="font-size:12.5px; color:var(--danger); background:none; border:1px solid var(--danger); border-radius:8px; padding:7px 14px; cursor:pointer; font-weight:600;">Reset analytics</button>
      </div>
    </div>
    <div class="analytics-card">
      <h3>Top pages</h3>
      <div id="topPagesList"></div>
    </div>
    <div class="analytics-card">
      <h3>How far people scroll</h3>
      <div id="scrollDepthList"></div>
    </div>
    <div class="analytics-card">
      <h3>Recent logins</h3>
      <div id="loginsList"></div>
    </div>
  </div>

  <div class="tab-panel" id="panel-chat">
    <div style="display:flex; justify-content:flex-end; gap:8px; margin-bottom:12px;">
      <button class="btn-secondary" id="exportChatBtn">Export CSV</button>
      <button id="clearChatBtn" style="font-size:12.5px; color:var(--danger); background:none; border:1px solid var(--danger); border-radius:8px; padding:7px 14px; cursor:pointer; font-weight:600;">Clear all chat history</button>
    </div>
    <div style="display:flex; gap:16px; height:520px;">
      <div style="width:220px; flex-shrink:0; border:1px solid var(--hair); border-radius:12px; overflow-y:auto; background:var(--ink2);" id="chatSessionList"></div>
      <div style="flex:1; display:flex; flex-direction:column; border:1px solid var(--hair); border-radius:12px; background:var(--ink2); overflow:hidden;">
        <div id="chatThread" style="flex:1; overflow-y:auto; padding:16px;"></div>
        <div id="chatTypingPreview" style="display:none; padding:8px 16px; font-size:12.5px; color:var(--mute); font-style:italic; border-top:1px solid var(--hair);"></div>
        <div style="display:flex; gap:8px; padding:12px; border-top:1px solid var(--hair);">
          <input type="text" id="chatReplyInput" placeholder="Reply..." style="flex:1;">
          <button class="btn-primary" id="chatReplyBtn">Send</button>
        </div>
      </div>
    </div>
  </div>

  <div class="tab-panel" id="panel-inbox">
    <div class="analytics-card">
      <h3>Quote & contact requests</h3>
      <div class="sub" style="font-size:12px; color:var(--mute); margin-bottom:14px;">From the "Get a quote" form.</div>
      <div id="quoteRequestsList"></div>
    </div>
    <div class="analytics-card">
      <h3>Chat conversations</h3>
      <div class="sub" style="font-size:12px; color:var(--mute); margin-bottom:14px;">Every conversation, including ones started while no admin was online. Click to open in the Chat tab.</div>
      <div id="inboxChatList"></div>
    </div>
  </div>
</div>

<div id="site-footer"></div>

<script type="module">
  import { renderHeader, renderFooter } from './assets/site-chrome.js?v3';
  import { supabase } from './shared/supabaseClient.js?v3';
  import { requireAdmin } from './shared/auth.js?v3';
  import { getAllOrders, updateOrderStatus, postComment, uploadDeliverable, getDownloadUrl, formatMoney, deleteOrder, markReviewRequested } from './shared/orders.js?v3';
  import { getAnalyticsSummary, resetAnalytics, getAllAnalyticsEvents } from './shared/analytics.js?v3';
  import { announceAdminPresence, getOpenSessions, getMessages, sendMessage, subscribeToMessages, subscribeToTyping, closeSession, deleteSession, clearAllChatHistory, subscribeAdminInbox } from './shared/chat.js?v3';
  import { arrayToCsv, downloadCsv } from './shared/csv.js?v3';
  import { getQuoteRequests, updateQuoteStatus } from './shared/quotes.js?v3';

  renderHeader('admin-orders.html');
  renderFooter();

  const staffUser = await requireAdmin();
  if (!staffUser) throw new Error('redirecting');
  announceAdminPresence();

  let unreadChatActivity = 0;
  function bumpChatBadge(){
    const onChatTab = document.getElementById('panel-chat').classList.contains('on');
    if (onChatTab) return; // already looking at it — nothing to flag
    unreadChatActivity++;
    const badge = document.getElementById('chatBadge');
    badge.textContent = unreadChatActivity;
    badge.style.display = 'inline-block';
  }
  function clearChatBadge(){
    unreadChatActivity = 0;
    const badge = document.getElementById('chatBadge');
    badge.style.display = 'none';
  }
  subscribeAdminInbox({
    onNewSession: () => { bumpChatBadge(); loadChatSessions(); },
    onNewMessage: () => { bumpChatBadge(); loadChatSessions(); },
  });

  const STATUSES = ['pending_payment','paid','in_progress','delivered','cancelled'];
  let currentFilter = 'all';
  let allOrders = [];
  let expandedOrders = new Set();

  document.querySelectorAll('.tab-row button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-row button').forEach(b => b.classList.remove('on'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('on'));
      btn.classList.add('on');
      document.getElementById('panel-' + btn.dataset.tab).classList.add('on');
      if (btn.dataset.tab === 'chat') { loadChatSessions(); clearChatBadge(); }
      if (btn.dataset.tab === 'inbox') loadInbox();
    });
  });

  document.getElementById('filterBar').innerHTML =
    `<button data-f="all" class="on">All</button>` +
    STATUSES.map(s => `<button data-f="${s}">${s.replace('_',' ')}</button>`).join('');
  document.querySelectorAll('.filter-bar button').forEach(b => {
    b.addEventListener('click', () => {
      currentFilter = b.dataset.f;
      document.querySelectorAll('.filter-bar button').forEach(x => x.classList.remove('on'));
      b.classList.add('on');
      drawOrders();
    });
  });

  async function load(){
    try {
      allOrders = await getAllOrders();
      drawStats();
      drawOrders();
    } catch (err) {
      document.getElementById('ordersList').innerHTML = `<div class="form-error">${err.message}</div>`;
      console.error(err);
    }
  }

  document.getElementById('exportOrdersBtn').addEventListener('click', () => {
    const csv = arrayToCsv(allOrders, [
      { label: 'Order ID', value: 'id' },
      { label: 'Customer name', value: o => o.profiles?.full_name || '' },
      { label: 'Customer email', value: o => o.profiles?.email || '' },
      { label: 'Plan', value: 'plan_label' },
      { label: 'Price', value: o => (o.price_cents / 100).toFixed(2) },
      { label: 'Currency', value: 'currency' },
      { label: 'Status', value: 'status' },
      { label: 'Notes', value: 'notes' },
      { label: 'Created', value: o => new Date(o.created_at).toISOString() },
    ]);
    downloadCsv(`fieldnote-orders-${new Date().toISOString().slice(0,10)}.csv`, csv);
  });

  function drawStats(){
    const revenue = allOrders.filter(o => o.status !== 'pending_payment' && o.status !== 'cancelled')
      .reduce((sum, o) => sum + o.price_cents, 0);
    const pending = allOrders.filter(o => o.status === 'pending_payment').length;
    document.getElementById('statRow').innerHTML = `
      <div class="stat-card"><div class="num">${formatMoney(revenue, 'eur')}</div><div class="lbl">Revenue</div></div>
      <div class="stat-card"><div class="num">${allOrders.length}</div><div class="lbl">Total orders</div></div>
      <div class="stat-card"><div class="num">${pending}</div><div class="lbl">Awaiting payment</div></div>
      <div class="stat-card" id="statPageviews"><div class="num">–</div><div class="lbl">Pageviews (30d)</div></div>
      <div class="stat-card" id="statVisitors"><div class="num">–</div><div class="lbl">Visitors (30d)</div></div>
    `;
  }

  function drawOrders(){
    const list = currentFilter === 'all' ? allOrders : allOrders.filter(o => o.status === currentFilter);
    const el = document.getElementById('ordersList');
    if (!list.length) { el.innerHTML = `<p style="color:var(--mute); padding:30px 0;">No orders in this view.</p>`; return; }
    el.innerHTML = list.map(o => renderOrder(o)).join('');
    bindOrder();
  }

  function renderOrder(o){
    const files = (o.order_files || []);
    const comments = (o.order_comments || []).sort((a,b) => new Date(a.created_at) - new Date(b.created_at));
    const isOpen = expandedOrders.has(o.id);
    return `
      <div class="order-card" data-order="${o.id}">
        <div class="order-top">
          <div>
            <h3>${escapeHtml(o.plan_label)} — ${escapeHtml(o.profiles?.full_name || o.profiles?.email || 'Unknown customer')}</h3>
            <div class="order-meta">${escapeHtml(o.profiles?.email || '')} · ${new Date(o.created_at).toLocaleDateString()} · ${formatMoney(o.price_cents, o.currency)}</div>
          </div>
          <select class="status-select" data-order="${o.id}">
            ${STATUSES.map(s => `<option value="${s}" ${o.status===s?'selected':''}>${s.replace('_',' ')}</option>`).join('')}
          </select>
        </div>
        <span class="order-detail-toggle" data-toggle="${o.id}">${isOpen ? 'Hide details ▲' : `Details, files & comments (${files.length} files, ${comments.length} comments) ▾`}</span>
        <div class="order-detail ${isOpen ? 'open' : ''}" id="detail-${o.id}">
          ${o.notes ? `<p style="font-size:13px; color:var(--mute); margin-bottom:10px;">"${escapeHtml(o.notes)}"</p>` : ''}
          <div class="order-meta" style="margin-bottom:4px;">Files</div>
          ${files.length ? files.map(f => `<div class="file-row"><span>${escapeHtml(f.file_name)} ${f.uploaded_by_role==='customer' ? '<em style="color:var(--mute);">(from customer)</em>' : ''}</span><a href="#" class="dl-link" data-path="${f.file_path}" style="color:var(--coral); font-weight:700;">Download</a></div>`).join('') : `<div style="font-size:12.5px;color:var(--mute);">None yet.</div>`}
          <div class="upload-row"><input type="file" accept=".pdf,.doc,.docx,.odt,.txt,.rtf,.xls,.xlsx,.csv,.ods,.ppt,.pptx,.jpg,.jpeg,.png,.gif,.webp" data-upload="${o.id}"></div>

          <div class="order-meta" style="margin:14px 0 4px;">Comments</div>
          ${comments.length ? comments.map(c => `<div class="comment"><div class="who">${c.author_role === 'staff' ? 'You (staff)' : 'Customer'} · ${new Date(c.created_at).toLocaleDateString()}</div>${escapeHtml(c.body)}</div>`).join('') : `<div style="font-size:12.5px;color:var(--mute);">None yet.</div>`}
          <div class="comment-box">
            <input type="text" data-comment-input="${o.id}" placeholder="Reply to the customer...">
            <button class="btn-secondary" data-comment-send="${o.id}">Send</button>
          </div>
          <div style="display:flex; gap:10px; align-items:center; margin-top:16px; flex-wrap:wrap;">
            <button data-ask-review="${o.id}" class="btn-secondary" style="font-size:12px; padding:8px 14px;">${o.review_requested_at ? 'Ask again for a review' : 'Ask for a review'}</button>
            ${o.review_requested_at ? `<span style="font-size:11.5px; color:var(--mute);">Last asked ${formatChatDate(o.review_requested_at)}</span>` : ''}
          </div>
          <button data-delete-order="${o.id}" style="margin-top:12px; font-size:12px; color:var(--danger); background:none; border:1px solid var(--danger); border-radius:6px; padding:6px 12px; cursor:pointer;">Delete this order permanently</button>
        </div>
      </div>`;
  }

  function bindOrder(){
    document.querySelectorAll('[data-toggle]').forEach(el => {
      el.addEventListener('click', () => {
        const id = el.dataset.toggle;
        if (expandedOrders.has(id)) expandedOrders.delete(id); else expandedOrders.add(id);
        drawOrders();
      });
    });
    document.querySelectorAll('.status-select').forEach(sel => {
      sel.addEventListener('change', async () => {
        await updateOrderStatus(sel.dataset.order, sel.value);
        await load();
      });
    });
    document.querySelectorAll('[data-comment-send]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const orderId = btn.dataset.commentSend;
        const input = document.querySelector(`[data-comment-input="${orderId}"]`);
        const body = input.value.trim();
        if (!body) return;
        await postComment(orderId, staffUser.id, 'staff', body);
        expandedOrders.add(orderId);
        await load();
      });
    });
    document.querySelectorAll('[data-upload]').forEach(inp => {
      inp.addEventListener('change', async () => {
        const orderId = inp.dataset.upload;
        const file = inp.files[0];
        if (!file) return;
        try {
          await uploadDeliverable(orderId, file, staffUser.id);
          expandedOrders.add(orderId);
          await load();
        } catch (err) {
          alert('Upload failed: ' + err.message);
        }
      });
    });
    document.querySelectorAll('.dl-link').forEach(a => {
      a.addEventListener('click', async (e) => {
        e.preventDefault();
        const url = await getDownloadUrl(a.dataset.path);
        window.open(url, '_blank');
      });
    });
    document.querySelectorAll('[data-delete-order]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const orderId = btn.dataset.deleteOrder;
        const confirmed = confirm(
          "This permanently deletes the order, its files, and its comments — this is a real payment record, not just a status. " +
          "For most cases, setting status to 'cancelled' is the safer choice. Delete anyway?"
        );
        if (!confirmed) return;
        try {
          await deleteOrder(orderId);
          await load();
        } catch (err) {
          alert('Delete failed: ' + err.message);
        }
      });
    });
    document.querySelectorAll('[data-ask-review]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const orderId = btn.dataset.askReview;
        const order = allOrders.find(o => o.id === orderId);
        const email = order?.profiles?.email;
        if (!email) { alert("This customer's email isn't available."); return; }
        const name = order.profiles?.full_name || 'there';
        const subject = "How did we do?";
        const body = `Hi ${name},\n\nYour project (${order.plan_label}) is complete — thank you for working with Fieldnote! If you have a minute, we'd really appreciate a quick review.\n\n[link to wherever you want reviews — Google, Trustpilot, etc.]\n\nThanks again,\nFieldnote`;
        window.open(`mailto:${encodeURIComponent(email)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`);
        try {
          await markReviewRequested(orderId);
          await postComment(orderId, staffUser.id, 'staff', 'Asked the customer for a review.');
          expandedOrders.add(orderId);
          await load();
        } catch (err) {
          alert('Could not record the review request: ' + err.message);
        }
      });
    });
  }

  document.querySelectorAll('.range-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.range-btn').forEach(b => b.classList.remove('on'));
      btn.classList.add('on');
      loadAnalytics(parseInt(btn.dataset.days));
    });
  });

  document.getElementById('exportAnalyticsBtn').addEventListener('click', async () => {
    try {
      const events = await getAllAnalyticsEvents();
      const csv = arrayToCsv(events, [
        { label: 'Event type', value: 'event_type' },
        { label: 'Page', value: 'page_path' },
        { label: 'Scroll %', value: 'scroll_percent' },
        { label: 'Session ID', value: 'session_id' },
        { label: 'User ID', value: 'user_id' },
        { label: 'Referrer', value: 'referrer' },
        { label: 'Timestamp', value: e => new Date(e.created_at).toISOString() },
      ]);
      downloadCsv(`fieldnote-analytics-${new Date().toISOString().slice(0,10)}.csv`, csv);
    } catch (err) {
      alert('Export failed: ' + err.message);
    }
  });

  document.getElementById('resetAnalyticsBtn').addEventListener('click', async () => {
    if (!confirm('Permanently delete ALL analytics data (pageviews, scroll depth, logins)? This cannot be undone.')) return;
    try {
      await resetAnalytics();
      loadAnalytics(30);
    } catch (err) {
      alert('Reset failed: ' + err.message);
    }
  });

  async function loadAnalytics(days){
    try {
      const summary = await getAnalyticsSummary(days);

      const pvEl = document.getElementById('statPageviews');
      const vEl = document.getElementById('statVisitors');
      if (pvEl) pvEl.querySelector('.num').textContent = summary.totalPageviews;
      if (vEl) vEl.querySelector('.num').textContent = summary.uniqueSessions;

      document.getElementById('topPagesList').innerHTML = summary.topPages.length
        ? summary.topPages.map(([path, count]) => `<div class="top-pages-row"><span>${escapeHtml(path)}</span><strong>${count}</strong></div>`).join('')
        : `<div class="analytics-empty">No pageviews recorded yet.</div>`;

      const scrollEntries = Object.entries(summary.scrollByPage);
      document.getElementById('scrollDepthList').innerHTML = scrollEntries.length
        ? scrollEntries.map(([path, d]) => {
            const total = d.sessions.size || 1;
            return `<div style="margin:10px 0;">
              <div style="font-size:13px; font-weight:600; margin-bottom:6px;">${escapeHtml(path)}</div>
              ${[25,50,75,100].map(t => `
                <div style="display:flex; align-items:center; gap:10px; margin-bottom:4px;">
                  <span style="font-size:11.5px; color:var(--mute); width:40px;">${t}%</span>
                  <div class="scroll-bar-track"><div class="scroll-bar-fill" style="width:${Math.round((d[t]/total)*100)}%;"></div></div>
                  <span style="font-size:11.5px; color:var(--mute);">${d[t]}</span>
                </div>`).join('')}
            </div>`;
          }).join('')
        : `<div class="analytics-empty">No scroll data recorded yet.</div>`;

      if (summary.recentLogins.length) {
        const userIds = [...new Set(summary.recentLogins.map(l => l.user_id).filter(Boolean))];
        let profileMap = {};
        if (userIds.length) {
          const { data: profs } = await supabase.from('profiles').select('id, full_name, email').in('id', userIds);
          (profs || []).forEach(p => profileMap[p.id] = p);
        }
        document.getElementById('loginsList').innerHTML = summary.recentLogins.map(l => {
          const p = profileMap[l.user_id];
          const who = p ? (p.full_name || p.email) : 'Unknown';
          return `<div class="login-row"><span class="who">${escapeHtml(who)}</span><span class="when">${new Date(l.created_at).toLocaleString()}</span></div>`;
        }).join('');
      } else {
        document.getElementById('loginsList').innerHTML = `<div class="analytics-empty">No logins recorded yet.</div>`;
      }
    } catch (err) {
      console.error(err);
      document.getElementById('topPagesList').innerHTML = `<div class="form-error">Couldn't load analytics: ${err.message}</div>`;
    }
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str || '';
    return d.innerHTML;
  }
  function formatChatDate(iso){
    const d = new Date(iso);
    const now = new Date();
    const sameDay = d.toDateString() === now.toDateString();
    if (sameDay) return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    return d.toLocaleDateString([], {month:'short', day:'numeric'}) + ' · ' + d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  }

  const QUOTE_STATUSES = ['new','contacted','closed'];
  async function loadInbox(){
    // ---- quote / contact requests ----
    try {
      const quotes = await getQuoteRequests();
      const qEl = document.getElementById('quoteRequestsList');
      qEl.innerHTML = quotes.length ? quotes.map(q => `
        <div style="border-top:1px solid var(--hair); padding:14px 0;">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:12px;">
            <div>
              <div style="font-weight:700; font-size:14px;">${escapeHtml(q.name)}</div>
              <div style="font-size:12.5px; color:var(--mute); margin-top:2px;">${escapeHtml(q.email)}${q.company ? ' · ' + escapeHtml(q.company) : ''}${q.budget ? ' · ' + escapeHtml(q.budget) : ''}</div>
              <div style="font-size:11.5px; color:var(--mute); margin-top:2px;">${formatChatDate(q.created_at)}</div>
            </div>
            <select class="status-select" data-quote="${q.id}">
              ${QUOTE_STATUSES.map(s => `<option value="${s}" ${q.status===s?'selected':''}>${s}</option>`).join('')}
            </select>
          </div>
          ${q.message ? `<p style="font-size:13px; margin-top:10px; line-height:1.5;">${escapeHtml(q.message)}</p>` : ''}
          <a href="mailto:${encodeURIComponent(q.email)}?subject=${encodeURIComponent('Re: your Fieldnote quote request')}" style="font-size:12px; font-weight:700; color:var(--coral); display:inline-block; margin-top:8px;">Reply by email →</a>
        </div>
      `).join('') : `<div class="analytics-empty">No quote requests yet.</div>`;
      document.querySelectorAll('[data-quote]').forEach(sel => {
        sel.addEventListener('change', async () => {
          try { await updateQuoteStatus(sel.dataset.quote, sel.value); }
          catch (err) { alert('Update failed: ' + err.message); }
        });
      });
    } catch (err) {
      document.getElementById('quoteRequestsList').innerHTML = `<div class="form-error">${err.message}</div>`;
    }

    // ---- chat summary ----
    try {
      const sessions = await getOpenSessions();
      const cEl = document.getElementById('inboxChatList');
      cEl.innerHTML = sessions.length ? sessions.map(s => {
        const who = s.visitor_name || s.visitor_email || `Visitor ${s.id.slice(0,6)}`;
        const lastMsg = (s.chat_messages || []).slice(-1)[0];
        return `<div data-open-chat="${s.id}" style="border-top:1px solid var(--hair); padding:12px 0; cursor:pointer;">
          <div style="display:flex; justify-content:space-between;">
            <div style="font-weight:700; font-size:13.5px;">${escapeHtml(who)}</div>
            <div style="font-size:11.5px; color:var(--mute);">${formatChatDate(s.created_at)}</div>
          </div>
          <div style="font-size:12px; color:var(--mute); margin-top:2px;">${s.visitor_email ? escapeHtml(s.visitor_email) + ' · ' : ''}${lastMsg ? escapeHtml(lastMsg.body) : 'No messages'}</div>
        </div>`;
      }).join('') : `<div class="analytics-empty">No conversations yet.</div>`;
      document.querySelectorAll('[data-open-chat]').forEach(row => {
        row.addEventListener('click', () => {
          document.querySelector('[data-tab="chat"]').click();
          selectChatSession(row.dataset.openChat);
        });
      });
    } catch (err) {
      document.getElementById('inboxChatList').innerHTML = `<div class="form-error">${err.message}</div>`;
    }
  }

  // ---------------- chat ----------------
  let activeSessionId = null;
  let unsubChatMessages = null;
  let unsubChatTyping = null;

  document.getElementById('exportChatBtn').addEventListener('click', async () => {
    try {
      const sessions = await getOpenSessions();
      const rows = [];
      sessions.forEach(s => {
        const who = s.visitor_name || s.visitor_email || `Visitor ${s.id.slice(0,6)}`;
        (s.chat_messages || []).forEach(m => {
          rows.push({ session_id: s.id, who, visitor_email: s.visitor_email, sender_role: m.sender_role, body: m.body, created_at: m.created_at });
        });
      });
      const csv = arrayToCsv(rows, [
        { label: 'Session ID', value: 'session_id' },
        { label: 'Visitor', value: 'who' },
        { label: 'Email', value: 'visitor_email' },
        { label: 'Sender', value: 'sender_role' },
        { label: 'Message', value: 'body' },
        { label: 'Timestamp', value: r => new Date(r.created_at).toISOString() },
      ]);
      downloadCsv(`fieldnote-chat-${new Date().toISOString().slice(0,10)}.csv`, csv);
    } catch (err) {
      alert('Export failed: ' + err.message);
    }
  });

  document.getElementById('clearChatBtn').addEventListener('click', async () => {
    if (!confirm('Permanently delete ALL chat conversations and messages? This cannot be undone.')) return;
    try {
      await clearAllChatHistory();
      activeSessionId = null;
      document.getElementById('chatThread').innerHTML = '';
      loadChatSessions();
    } catch (err) {
      alert('Clear failed: ' + err.message);
    }
  });

  async function loadChatSessions(){
    try {
      const sessions = await getOpenSessions();
      const listEl = document.getElementById('chatSessionList');
      if (!sessions.length) { listEl.innerHTML = `<div class="analytics-empty" style="padding:16px;">No conversations yet.</div>`; return; }
      listEl.innerHTML = sessions.map(s => {
        const msgCount = (s.chat_messages || []).length;
        const lastMsg = (s.chat_messages || []).slice(-1)[0];
        const who = s.visitor_name || s.visitor_email || `Visitor ${s.id.slice(0,6)}`;
        return `<div class="chat-session-row" data-session="${s.id}" style="padding:12px 14px; border-bottom:1px solid var(--hair); cursor:pointer; display:flex; justify-content:space-between; align-items:flex-start; gap:6px; ${s.id===activeSessionId?'background:var(--hair);':''}">
          <div style="min-width:0;">
            <div style="font-size:13px; font-weight:700;">${escapeHtml(who)}</div>
            <div style="font-size:10.5px; color:var(--mute); margin-top:1px;">Started ${formatChatDate(s.created_at)}</div>
            <div style="font-size:11.5px; color:var(--mute); margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${lastMsg ? escapeHtml(lastMsg.body) : 'No messages'} </div>
          </div>
          <button data-remove-session="${s.id}" style="flex-shrink:0; background:none; border:none; color:var(--mute); cursor:pointer; font-size:13px; padding:2px 4px;" title="Remove this conversation">✕</button>
        </div>`;
      }).join('');
      document.querySelectorAll('.chat-session-row').forEach(row => {
        row.addEventListener('click', (e) => {
          if (e.target.closest('[data-remove-session]')) return;
          selectChatSession(row.dataset.session);
        });
      });
      document.querySelectorAll('[data-remove-session]').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          if (!confirm('Remove this conversation permanently?')) return;
          try {
            await deleteSession(btn.dataset.removeSession);
            if (activeSessionId === btn.dataset.removeSession) {
              activeSessionId = null;
              document.getElementById('chatThread').innerHTML = '';
            }
            loadChatSessions();
          } catch (err) {
            alert('Remove failed: ' + err.message);
          }
        });
      });
      if (!activeSessionId && sessions.length) selectChatSession(sessions[0].id);
    } catch (err) {
      document.getElementById('chatSessionList').innerHTML = `<div class="form-error" style="margin:12px;">${err.message}</div>`;
    }
  }

  async function selectChatSession(sessionId){
    activeSessionId = sessionId;
    if (unsubChatMessages) unsubChatMessages();
    if (unsubChatTyping) unsubChatTyping();
    document.getElementById('chatTypingPreview').style.display = 'none';

    const thread = document.getElementById('chatThread');
    thread.innerHTML = '';
    const messages = await getMessages(sessionId);
    messages.forEach(renderChatMsg);
    thread.scrollTop = thread.scrollHeight;

    unsubChatMessages = subscribeToMessages(sessionId, (msg) => {
      renderChatMsg(msg);
      thread.scrollTop = thread.scrollHeight;
      loadChatSessions(); // refresh preview text in the session list
    });
    // The actual live-typing-preview feature: shows what the visitor is
    // typing before they hit send, updating on every keystroke.
    unsubChatTyping = subscribeToTyping(sessionId, (text) => {
      const preview = document.getElementById('chatTypingPreview');
      if (text) { preview.style.display = 'block'; preview.textContent = `Typing: "${text}"`; }
      else { preview.style.display = 'none'; }
    });

    document.querySelectorAll('.chat-session-row').forEach(row => {
      row.style.background = row.dataset.session === sessionId ? 'var(--hair)' : '';
    });
  }

  function renderChatMsg(msg){
    const thread = document.getElementById('chatThread');
    const wrap = document.createElement('div');
    wrap.style.cssText = `margin-bottom:10px; max-width:80%; ${msg.sender_role === 'admin' ? 'margin-left:auto;' : 'margin-right:auto;'}`;
    const bubble = document.createElement('div');
    bubble.style.cssText = `padding:8px 12px; border-radius:10px; font-size:13px; line-height:1.4; ${msg.sender_role === 'admin' ? 'background:var(--coral); color:var(--oncoral);' : 'background:var(--ink2); color:var(--paper); border:1px solid var(--hair);'}`;
    bubble.textContent = msg.body;
    wrap.appendChild(bubble);
    const time = document.createElement('div');
    time.style.cssText = `font-size:10.5px; color:var(--mute); margin-top:3px; text-align:${msg.sender_role === 'admin' ? 'right' : 'left'};`;
    time.textContent = new Date(msg.created_at || Date.now()).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    wrap.appendChild(time);
    thread.appendChild(wrap);
  }

  document.getElementById('chatReplyBtn').addEventListener('click', sendChatReply);
  document.getElementById('chatReplyInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') sendChatReply(); });
  async function sendChatReply(){
    if (!activeSessionId) return;
    const input = document.getElementById('chatReplyInput');
    const body = input.value.trim();
    if (!body) return;
    input.value = '';
    renderChatMsg({ sender_role: 'admin', body, created_at: new Date().toISOString() });
    await sendMessage(activeSessionId, 'admin', body);
  }

  load();
  loadAnalytics(30);
</script>
</body>
</html>
