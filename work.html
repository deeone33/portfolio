<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Work — Fieldnote</title>
<link rel="stylesheet" href="assets/styles.css">
<style>
  .work-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:20px; padding-bottom:60px;}
  .work-card{border-radius:16px; overflow:hidden; border:1px solid var(--hair); background:var(--ink2); box-shadow:0 2px 10px -6px var(--shadow); transition:.18s ease;}
  .work-card:hover{transform:translateY(-3px); box-shadow:0 16px 34px -14px var(--shadow);}
  .work-thumb{height:220px; display:flex; align-items:center; justify-content:center;}
  .work-thumb.p0{background:linear-gradient(135deg,#EFE3DC,#E3D3C8);}
  .work-thumb.p1{background:linear-gradient(135deg,#DCE6E9,#C9DADD);}
  .work-thumb.p2{background:linear-gradient(135deg,#E6E1EC,#D6CEE0);}
  .work-thumb.p3{background:linear-gradient(135deg,#DEE7DA,#C9D9C4);}
  .work-thumb svg{width:40px; height:40px; color:var(--paper); opacity:.35;}
  .work-body{padding:20px 22px;}
  .work-body h3{font-size:17px; font-weight:700;}
  .work-body p{font-size:13.5px; color:var(--mute); margin-top:6px; line-height:1.55;}
  .work-tag{display:inline-block; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--coral); margin-top:10px;}
</style>
</head>
<body>
<div id="site-header"></div>

<div class="wrap">
  <section class="page-hero">
    <div class="eyebrow">Selected work</div>
    <h1>A few of the sites we've shipped.</h1>
    <p>Small businesses, mostly across the Baltics — each one designed and built from scratch, never a template.</p>
  </section>

  <div class="work-grid" id="workGrid"></div>

  <div style="text-align:center; padding-bottom:60px;">
    <a href="pricing.html" class="btn-primary">See pricing →</a>
  </div>
</div>

<div id="site-footer"></div>

<script type="module">
  import { renderHeader, renderFooter } from './assets/site-chrome.js';
  renderHeader('work.html');
  renderFooter();

  const ICONS = {
    cart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="20" r="1.4" fill="currentColor" stroke="none"/><circle cx="17" cy="20" r="1.4" fill="currentColor" stroke="none"/><path d="M2 3h3l2.5 12h10L20 7H6"/></svg>',
    calendar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
    users: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c0-3.5 3-6 6.5-6s6.5 2.5 6.5 6"/><circle cx="17.5" cy="9" r="2.6"/><path d="M15.5 20c.2-2.6 1.8-4.6 4-5.4"/></svg>',
    layout: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 9v12"/></svg>',
    heart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21s-7-4.5-9.5-9C.5 8 2 4 6 4c2.3 0 3.7 1.3 4.5 2.5 0 0 .5-.5 1.5-.5C15.5 6 20 8.5 20 12c0 4.5-8 9-8 9z"/></svg>',
    book: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v17H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/></svg>',
  };
  const items = [
    { icon:'cart', p:'p0', tag:'E-commerce', title:'Nordic Bakery', desc:'Full online storefront with local delivery scheduling and seasonal menus.' },
    { icon:'calendar', p:'p1', tag:'Booking', title:'Tallinn Yoga Room', desc:'Class booking, membership tiers, and a waitlist system for popular sessions.' },
    { icon:'users', p:'p2', tag:'Community', title:'Baltic Fitness Studio', desc:'Member portal with class schedules, progress tracking, and a private forum.' },
    { icon:'layout', p:'p3', tag:'Portfolio', title:'Studio Marek', desc:'A minimal, image-led portfolio for an architecture practice.' },
    { icon:'heart', p:'p0', tag:'Services', title:'Riia Skin Clinic', desc:'Appointment booking with automated reminders and a treatment price list.' },
    { icon:'book', p:'p1', tag:'Content', title:'Estonian Folk Archive', desc:'A searchable multilingual archive with contributor accounts.' },
  ];
  document.getElementById('workGrid').innerHTML = items.map(it => `
    <div class="work-card">
      <div class="work-thumb ${it.p}">${ICONS[it.icon]}</div>
      <div class="work-body">
        <span class="work-tag">${it.tag}</span>
        <h3>${it.title}</h3>
        <p>${it.desc}</p>
      </div>
    </div>`).join('');
</script>
</body>
</html>
