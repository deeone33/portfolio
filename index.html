<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fieldnote — Tier 1 CMS Prototype</title>
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('fieldnote_theme') || 'light');</script>
<style>
  :root{
    --chrome-dark:#1E2126;
    --ink:#EEF0F2; --ink2:#F7F8F9; --paper:#1E2126; --coral:#35414F; --oncoral:#F5F6F7; --oncoral-strong:#EEF0F2;
    --mint:#4E6570; --mute:#50565F; --hair:rgba(30,33,38,.10); --linecol:rgba(30,33,38,.14);
    --dotcol:rgba(30,33,38,.25); --dashcol:rgba(30,33,38,.18); --shadow:rgba(20,22,26,.14);
    --glow1:rgba(53,65,79,.10); --glow2:rgba(78,101,112,.08);
    --card-a:linear-gradient(160deg,#FAFBFC,#E9ECEF); --card-b:linear-gradient(160deg,#F4F5F7,#E4E7EA); --card-c:linear-gradient(160deg,#F7F8FA,#E7EAED);
    --admin:#C7501F;
    --danger:#A1352A;
  }
  [data-theme="dark"]{
    --ink:#14161A; --ink2:#1C1F24; --paper:#EDEFF2; --coral:#8FA8C7; --oncoral:#14161A; --oncoral-strong:#1C1F24;
    --mint:#8FB3B8; --mute:#9BA3AD; --hair:rgba(255,255,255,.12); --linecol:rgba(255,255,255,.16);
    --dotcol:rgba(255,255,255,.3); --dashcol:rgba(255,255,255,.2); --shadow:rgba(0,0,0,.5);
    --glow1:rgba(143,168,199,.14); --glow2:rgba(143,179,184,.12);
    --card-a:linear-gradient(160deg,#22262C,#1C1F24); --card-b:linear-gradient(160deg,#1E2126,#181B1F); --card-c:linear-gradient(160deg,#242830,#1A1D22);
    --danger:#D9695C;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html{ scroll-behavior:smooth; }
  body{ background:linear-gradient(180deg, #F7F2E6 0%, #EDEDEA 50%, #DFE5EA 100%); background-attachment:fixed; color:var(--paper); font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif; overflow-x:hidden; }
  [data-theme="dark"] body{ background:linear-gradient(180deg, #1B1E23 0%, #16181C 50%, #101214 100%); background-attachment:fixed; }
  body, .bcard, .plan, .rcard, .wcard, header, footer, .icon-badge, .pstep-icon, .form-card, input, textarea, select{ transition: background-color .25s ease, color .25s ease, border-color .25s ease; }
  .wrap{ max-width:1120px; margin:0 auto; padding:0 44px; }
  a{ color:inherit; text-decoration:none; }
  ul{ list-style:none; }

  /* ---------- ADMIN BAR ---------- */
  #adminbar{ display:none; position:sticky; top:0; z-index:200; background:var(--chrome-dark); color:#fff; padding:10px 20px; align-items:center; justify-content:space-between; font-size:13px; }
  #adminbar.on{ display:flex; }
  #adminbar .left{ display:flex; align-items:center; gap:12px; }
  #adminbar .dot{ width:8px; height:8px; border-radius:50%; background:var(--admin); }
  #adminbar button{ font-family:inherit; font-size:12.5px; font-weight:600; border:none; border-radius:6px; padding:8px 14px; cursor:pointer; }
  #adminbar .publish{ background:var(--admin); color:#fff; }
  #adminbar .hidden-btn{ background:rgba(255,255,255,.12); color:#fff; }
  #adminbar .exit{ background:none; color:#bbb; }

  /* ---------- EDIT AFFORDANCES ---------- */
  .editable{ position:relative; }
  body.admin.edit-mode .editable:hover{ outline:1.5px dashed var(--admin); outline-offset:4px; border-radius:4px; }
  .edit-pencil{ display:none; position:absolute; top:-12px; right:-12px; width:26px; height:26px; border-radius:50%; background:var(--admin); color:#fff; align-items:center; justify-content:center; font-size:12px; cursor:pointer; z-index:15; box-shadow:0 4px 10px rgba(0,0,0,.25); }
  body.admin.edit-mode .editable:hover .edit-pencil{ display:flex; }
  /* Nav links sit tight against each other — a full-size pencil at the default offset
     overlaps the next link and makes it unclear (and hard) to click. Smaller + tucked in. */
  nav .link .edit-pencil, nav .cta .edit-pencil{ width:18px; height:18px; font-size:9px; top:-8px; right:-8px; }
  nav{ gap:26px; } /* a little more breathing room now that pencils sit inside that gap */
  .reorder-controls{ display:none; position:absolute; top:-12px; left:-12px; flex-direction:column; gap:3px; z-index:15; }
  body.admin.edit-mode .box-wrap:hover .reorder-controls{ display:flex; }
  .reorder-controls button{ width:22px; height:18px; border:none; background:var(--chrome-dark); color:#fff; font-size:10px; cursor:pointer; border-radius:4px; }
  .section-gear{ display:none; position:absolute; top:6px; right:6px; width:28px; height:28px; border-radius:50%; background:rgba(255,255,255,.9); color:var(--chrome-dark); border:1px solid var(--hair); align-items:center; justify-content:center; cursor:pointer; font-size:13px; z-index:12; }
  body.admin.edit-mode .section-shell:hover .section-gear{ display:flex; }
  .section-shell{ position:relative; }

  /* Hovering the gear/arrows highlights exactly which section or box they control —
     answers "which box is this cogwheel attached to" the way devtools inspect does. */
  body.admin.edit-mode .section-shell:has(.section-gear:hover){ outline:2px solid var(--admin); outline-offset:-2px; background:rgba(199,80,31,.04); }
  body.admin.edit-mode .box-wrap:has(.reorder-controls button:hover){ outline:2px solid var(--admin); outline-offset:-2px; }

  body.admin.edit-mode [data-editpath]{ cursor:text; }
  .inline-editing{ outline:2px solid var(--admin) !important; outline-offset:2px; background:rgba(199,80,31,.06); border-radius:4px; }

  /* ---------- PANEL (side editor) ---------- */
  #panel-backdrop{ position:fixed; inset:0; background:rgba(20,22,26,.35); display:none; z-index:300; }
  #panel-backdrop.open{ display:block; }
  #panel{ position:fixed; top:0; right:0; height:100%; width:320px; background:var(--ink2); box-shadow:-10px 0 30px rgba(0,0,0,.15); z-index:301; padding:24px; overflow-y:auto; transform:translateX(100%); transition:.25s; }
  #panel.open{ transform:translateX(0); }
  #panel h4{ font-size:15px; font-weight:800; margin-bottom:4px; }
  #panel .sub{ font-size:12px; color:var(--mute); margin-bottom:18px; }
  #panel label{ display:block; font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--mute); margin:16px 0 6px; }
  #panel input[type=text], #panel textarea, #panel select{ width:100%; padding:9px 10px; border:1px solid var(--hair); border-radius:6px; font-size:13.5px; font-family:inherit; }
  #panel textarea{ min-height:70px; resize:vertical; }
  #panel input[type=range]{ width:100%; }
  #panel input[type=text], #panel textarea, #panel select{ background:var(--ink); color:var(--paper); }
  #panel input[type=color]{ width:100%; height:34px; border:1px solid var(--hair); border-radius:6px; }
  #panel .row{ display:flex; gap:8px; }
  #panel .row > *{ flex:1; }
  #panel .toggle-group{ display:flex; gap:6px; margin-top:4px; }
  #panel .toggle-group button{ flex:1; padding:8px; border:1px solid var(--hair); background:var(--ink2); color:var(--paper); border-radius:6px; cursor:pointer; font-family:inherit; font-size:13px; }
  #panel .toggle-group button.on{ background:var(--chrome-dark); color:#fff; border-color:var(--chrome-dark); }
  #panel .danger{ margin-top:24px; width:100%; padding:11px; border-radius:8px; border:1px solid #E2A79C; background:#FBEDEA; color:#A1352A; font-weight:700; font-size:13px; cursor:pointer; }
  #panel .close-panel{ position:absolute; top:16px; right:16px; background:none; border:none; font-size:16px; cursor:pointer; color:var(--mute); }
  #panel .imgprev{ margin-top:8px; width:100%; height:80px; border-radius:6px; background-size:cover; background-position:center; border:1px solid var(--hair); }

  /* ---------- LOGIN MODAL ---------- */
  .modal-backdrop{ position:fixed; inset:0; background:rgba(20,22,26,.45); display:none; align-items:center; justify-content:center; z-index:250; }
  .modal-backdrop.open{ display:flex; }
  .modal{ background:var(--ink); border:1px solid var(--hair); border-radius:16px; padding:32px; width:340px; box-shadow:0 30px 60px -20px var(--shadow); position:relative; }
  .modal h3{ font-size:19px; font-weight:800; margin-bottom:6px; }
  .modal p{ font-size:13px; color:var(--mute); margin-bottom:20px; }
  .modal input{ width:100%; padding:12px 14px; border-radius:8px; border:1px solid var(--hair); background:var(--ink2); font-size:14px; margin-bottom:10px; color:var(--paper); font-family:inherit; }
  .modal .go{ width:100%; margin-top:6px; padding:13px; border-radius:100px; background:var(--paper); color:var(--ink); font-weight:700; font-size:14px; border:none; cursor:pointer; }
  .modal-close{ position:absolute; top:16px; right:16px; background:none; border:none; color:var(--mute); font-size:18px; cursor:pointer; }
  .modal .note{ font-size:11.5px; color:var(--mute); margin-top:14px; text-align:center; }

  /* ---------- HIDDEN ELEMENTS DRAWER ---------- */
  #hidden-drawer{ position:fixed; bottom:0; left:0; right:0; background:var(--ink2); border-top:1px solid var(--hair); z-index:260; padding:16px 24px; display:none; max-height:40vh; overflow-y:auto; }
  #hidden-drawer.open{ display:block; }
  #hidden-drawer h4{ font-size:14px; margin-bottom:10px; }
  .hidden-row{ display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-top:1px solid var(--hair); font-size:13px; }
  .hidden-row button{ font-size:12px; font-weight:700; border:none; background:var(--admin); color:#fff; padding:6px 12px; border-radius:6px; cursor:pointer; }

  /* ---------- PUBLISH PREVIEW ---------- */
  #publish-modal .modal{ width:520px; max-height:70vh; overflow-y:auto; }
  #publish-modal pre{ background:#111; color:#8FE3C4; font-size:11px; padding:14px; border-radius:8px; overflow-x:auto; max-height:320px; }

  /* ---------- SITE CHROME (from approved design) ---------- */
  header{ display:flex; justify-content:space-between; align-items:center; padding:28px 0; position:relative; z-index:10; }
  .logo{ font-weight:800; font-size:19px; letter-spacing:-.01em; }
  .logo .dot{ color:var(--coral); }
  nav{ display:flex; align-items:center; gap:22px; }
  nav a.link{ font-size:14.5px; font-weight:500; color:var(--mute); padding:8px 10px; border-radius:6px; transition:.15s ease; }
  nav a.link:hover{ color:var(--paper); background:var(--hair); }
  nav .cta{ background:var(--coral); color:var(--oncoral); font-weight:700; font-size:14px; padding:13px 24px; border-radius:100px; transition:.18s ease; box-shadow:0 4px 14px -6px var(--shadow); }
  nav .cta:hover{ background:var(--paper); color:var(--ink); transform:translateY(-2px); box-shadow:0 10px 24px -8px var(--shadow); }
  .lang{ position:relative; }
  .lang-btn{ display:flex; align-items:center; gap:6px; background:none; border:none; cursor:pointer; font-family:inherit; padding:6px; border-radius:8px; }
  .lang-btn:hover{ background:var(--hair); }
  .lang-flag{ width:20px; height:14px; border-radius:2px; overflow:hidden; box-shadow:0 0 0 1px var(--hair); display:block; }
  .lang-caret{ font-size:9px; color:var(--mute); }
  .lang-menu{ position:absolute; top:calc(100% + 10px); right:0; background:var(--ink2); border:1px solid var(--hair); border-radius:10px; padding:6px; display:none; min-width:150px; box-shadow:0 12px 30px -10px var(--shadow); z-index:20; }
  .lang.open .lang-menu{ display:block; }
  .lang-option{ display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:6px; font-size:13.5px; font-weight:500; cursor:pointer; }
  .lang-option:hover{ background:var(--hair); }
  .lang-option.active{ color:var(--coral); font-weight:700; }
  .account-btn{ width:34px; height:34px; border-radius:50%; border:1.5px solid var(--hair); background:none; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--mute); opacity:.75; }
  .account-btn:hover{ opacity:1; border-color:var(--mute); color:var(--paper); }

  .hero{ position:relative; }
  .hero-grid{ display:grid; grid-template-columns:1.05fr .95fr; gap:20px; align-items:center; position:relative; }
  .hero .glow{ position:absolute; width:460px; height:460px; border-radius:50%; background:radial-gradient(circle, rgba(53,65,79,.10), transparent 70%); top:-140px; right:-100px; pointer-events:none; filter:blur(10px); z-index:0; }
  .eyebrow{ display:inline-flex; align-items:center; gap:8px; font-size:13px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--mint); margin-bottom:22px; }
  .eyebrow .bar{ width:22px; height:2px; background:var(--mint); }
  h1{ font-size:52px; line-height:1.08; font-weight:800; letter-spacing:-.03em; }
  .hero p.lead{ font-size:16px; color:var(--mute); max-width:440px; margin-top:24px; line-height:1.65; }
  .hero-ctas{ display:flex; gap:14px; margin-top:32px; align-items:center; }
  .btn-primary{ background:var(--paper); color:var(--ink); font-weight:700; font-size:14.5px; padding:16px 30px; border-radius:100px; display:inline-block; transition:.18s ease; box-shadow:0 6px 18px -8px var(--shadow); }
  .btn-primary:hover{ background:var(--coral); color:var(--oncoral); transform:translateY(-2px); box-shadow:0 12px 26px -8px var(--shadow); }
  .btn-ghost{ font-weight:600; font-size:14.5px; color:var(--paper); display:flex; align-items:center; gap:8px; transition:.15s ease; }
  .btn-ghost:hover{ gap:12px; }
  .btn-ghost .arrow{ width:32px; height:32px; border-radius:50%; border:1.5px solid var(--mute); display:flex; align-items:center; justify-content:center; transition:.15s ease; }
  .btn-ghost:hover .arrow{ background:var(--paper); border-color:var(--paper); color:var(--ink); }

  /* hero visual: uploaded photo OR default browser-fan illustration */
  .hero-visual{ position:relative; }
  .hero-visual .uploaded-img{ width:100%; border-radius:16px; object-fit:cover; box-shadow:0 30px 60px -20px var(--shadow); }
  .hero-fan{ position:relative; height:340px; }
  .hfan-card{ position:absolute; width:220px; height:270px; border-radius:14px; box-shadow:0 30px 60px -20px var(--shadow); border:1px solid var(--hair); background:var(--ink2); transition:transform .3s ease; }
  .hero-fan:hover .hfan-card{ transform:translateY(-6px); }
  .hfan-top{ height:26px; display:flex; align-items:center; gap:5px; padding:0 12px; }
  .hfan-top span{ width:6px; height:6px; border-radius:50%; background:var(--dotcol); }
  .hfan-body{ padding:14px; }
  .hfan-line{ height:7px; border-radius:4px; background:var(--linecol); margin-bottom:7px; }
  .hfan-line.short{ width:55%; }
  .hfan-block{ height:56px; border-radius:8px; margin:12px 0; background:var(--linecol); }
  .hfan-block.accent{ background:var(--coral); opacity:.9; }
  .hfan-c1{ top:0; left:95px; transform:rotate(-8deg); z-index:1; }
  .hfan-c2{ top:24px; left:0; transform:rotate(5deg); z-index:2; }
  .hfan-c3{ top:46px; left:190px; transform:rotate(13deg); z-index:0; }

  .icon-badge{ width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; margin-bottom:12px; }
  .icon-badge.tint-0{ background:#F5DED6; border:1px solid #E9C3B7; color:#B85C42; }
  .icon-badge.tint-1{ background:#DCE8DA; border:1px solid #C3DABF; color:#4C7A52; }
  .icon-badge.tint-2{ background:#D9E4EF; border:1px solid #BDD1E3; color:#3D6690; }
  .icon-badge.tint-3{ background:#F3E6C8; border:1px solid #E6D2A0; color:#9C7A2E; }
  .icon-badge.tint-4{ background:#E7E0EF; border:1px solid #D4C7E3; color:#6C5A94; }
  .icon-badge.tint-5{ background:#F3DCE3; border:1px solid #E7C2CE; color:#B14A6E; }
  [data-theme="dark"] .icon-badge.tint-0{ background:#3A2A22; border-color:#4A362A; color:#E0A88F; }
  [data-theme="dark"] .icon-badge.tint-1{ background:#22322A; border-color:#2E4236; color:#9FCBAA; }
  [data-theme="dark"] .icon-badge.tint-2{ background:#20303E; border-color:#2A4054; color:#9BC0E0; }
  [data-theme="dark"] .icon-badge.tint-3{ background:#3A3020; border-color:#4E4028; color:#E0C285; }
  [data-theme="dark"] .icon-badge.tint-4{ background:#302838; border-color:#40364C; color:#C6ADE0; }
  [data-theme="dark"] .icon-badge.tint-5{ background:#3A2430; border-color:#4E3040; color:#E0A2BE; }
  .icon-badge svg{ width:18px; height:18px; }
  .pstep-head{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .pstep-icon{ width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; }
  .pstep-icon.tint-0{ background:#F5DED6; border:1px solid #E9C3B7; color:#B85C42; }
  .pstep-icon.tint-1{ background:#DCE8DA; border:1px solid #C3DABF; color:#4C7A52; }
  .pstep-icon.tint-2{ background:#D9E4EF; border:1px solid #BDD1E3; color:#3D6690; }
  .pstep-icon.tint-3{ background:#F3E6C8; border:1px solid #E6D2A0; color:#9C7A2E; }
  .pstep-icon.tint-4{ background:#E7E0EF; border:1px solid #D4C7E3; color:#6C5A94; }
  .pstep-icon.tint-5{ background:#F3DCE3; border:1px solid #E7C2CE; color:#B14A6E; }
  [data-theme="dark"] .pstep-icon.tint-0{ background:#3A2A22; border-color:#4A362A; color:#E0A88F; }
  [data-theme="dark"] .pstep-icon.tint-1{ background:#22322A; border-color:#2E4236; color:#9FCBAA; }
  [data-theme="dark"] .pstep-icon.tint-2{ background:#20303E; border-color:#2A4054; color:#9BC0E0; }
  [data-theme="dark"] .pstep-icon.tint-3{ background:#3A3020; border-color:#4E4028; color:#E0C285; }
  [data-theme="dark"] .pstep-icon.tint-4{ background:#302838; border-color:#40364C; color:#C6ADE0; }
  [data-theme="dark"] .pstep-icon.tint-5{ background:#3A2430; border-color:#4E3040; color:#E0A2BE; }
  .pstep-icon svg{ width:15px; height:15px; }

  .icon-picker{ display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin-top:4px; }
  .icon-picker button{ aspect-ratio:1; border:1px solid var(--hair); border-radius:8px; background:var(--ink2); cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--mute); }
  .icon-picker button svg{ width:16px; height:16px; }
  .icon-picker button.on{ background:var(--chrome-dark); color:#fff; border-color:var(--chrome-dark); }

  .strip{ border-top:1px solid var(--hair); border-bottom:1px solid var(--hair); padding:18px 0; }
  .strip .track{ display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px; }
  .strip span{ font-size:14px; font-weight:600; color:var(--mute); }
  .strip span b{ color:var(--paper); }

  .section-head{ padding:0 0 24px; }
  .section-head h2{ font-size:30px; font-weight:800; letter-spacing:-.02em; }
  .section-head p{ font-size:14px; color:var(--mute); margin-top:6px; }

  .bento{ display:grid; grid-template-columns:repeat(6,1fr); gap:14px; padding-bottom:20px; }
  .bcard{ grid-column: span var(--span, 2); border-radius:14px; padding:24px; min-height:150px; display:flex; flex-direction:column; justify-content:space-between; background:var(--ink2); border:1px solid var(--hair); box-shadow:0 2px 10px -6px var(--shadow); transition:.18s ease; }
  .bcard:hover{ box-shadow:0 14px 30px -12px var(--shadow); transform:translateY(-2px); }
  .bcard .n{ font-size:12.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--coral); }
  .bcard h3{ font-size:18px; font-weight:700; letter-spacing:-.01em; }
  .bcard p{ font-size:12.5px; line-height:1.5; color:var(--mute); }

  .process{ border-top:1px solid var(--hair); }
  .process-grid{ display:grid; grid-template-columns:repeat(var(--stepcols,4),1fr); gap:16px; margin-top:24px; }
  .pstep .num{ width:36px; height:36px; border-radius:50%; background:var(--ink); border:1.5px solid var(--coral); color:var(--coral); font-weight:800; font-size:13px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .pstep h4{ font-size:15px; font-weight:700; }
  .pstep p{ font-size:12.5px; color:var(--mute); margin-top:6px; }

  .pricing{ }
  .plans{ display:grid; grid-template-columns:repeat(var(--plancols,3),1fr); gap:16px; margin-top:24px; }
  .plan{ border-radius:16px; padding:28px 24px; border:1px solid var(--hair); background:var(--ink2); box-shadow:0 2px 10px -6px var(--shadow); transition:.18s ease; }
  .plan:hover{ box-shadow:0 14px 30px -12px var(--shadow); transform:translateY(-2px); }
  .plan.feat{ background:var(--coral); border:none; box-shadow:0 16px 34px -10px var(--shadow); }
  .plan-cta{ display:block; text-align:center; margin-top:18px; padding:12px; border-radius:100px; font-weight:700; font-size:13.5px; background:var(--paper); color:var(--ink); cursor:pointer; transition:.18s ease; }
  .plan-cta:hover{ background:var(--coral); color:var(--oncoral); transform:translateY(-2px); }
  .plan.feat .plan-cta{ background:var(--oncoral-strong); color:var(--coral); }
  .plan.feat .plan-cta:hover{ background:var(--paper); color:var(--ink); }
  .add-tile{ border:1.5px dashed var(--hair); border-radius:14px; background:none; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; cursor:pointer; color:var(--mute); font-size:13px; font-weight:600; min-height:100px; box-shadow:none; }
  .add-tile:hover{ border-color:var(--coral); color:var(--coral); background:var(--ink2); transform:none; }
  .add-tile span{ font-size:26px; font-weight:400; line-height:1; }

   text style started with (see DEFAULT_DATA). Since dark mode didn't exist
   when that system was built, those defaults got baked in as fixed hex
   colors that ignore the theme entirely — invisible dark-on-dark text in
   dark mode. This maps them back to the equivalent theme variable so
   untouched text adapts automatically. Any OTHER color (a color an admin
   actually picked via the panel) is left exactly as chosen — that's a
   deliberate choice and intentionally doesn't auto-theme. */

function iconBadgeAttrs(item, idx, baseClass){
  if (item.tint === 'none') return `class="${baseClass}" style="background:var(--ink);border-color:var(--hair);color:var(--mute);"`;
  if (item.tint) return `class="${baseClass}" style="background:color-mix(in srgb, ${item.tint} 22%, var(--ink2));border-color:color-mix(in srgb, ${item.tint} 40%, var(--ink2));color:${item.tint};"`;
  return `class="${baseClass} tint-${idx % 6}"`;
}

function render(){
  const s = siteData.sections;
  let html = '';

  if (!s.header.hidden) html += renderHeader();
  if (!s.hero.hidden) html += renderHero();
  if (!s.strip.hidden) html += renderStrip();
  if (!s.showcase.hidden) html += renderShowcase();
  if (!s.bento.hidden) html += renderBento();
  if (!s.process.hidden) html += renderProcess();
  if (!s.pricing.hidden) html += renderPricing();
  if (!s.reviews.hidden) html += renderReviews();
  if (!s.footer.hidden) html += renderFooter();

  document.getElementById('site').innerHTML = html;
  updateHiddenCount();
  bindPencils();
  bindShowcaseHover();
  startShowcaseAutoplay();
}

  b.cards.push({id, order:maxOrder+1, hidden:false, span:2, bg:null, image:null, icon:'layers',

/* Slow continuous autoplay — loops back to the start on reaching the end
   (always the same direction), pausing on hover. Manual arrow clicks give
   it a bigger nudge and pause autoplay briefly. */
let showcaseTimer = null;
let showcasePausedUntil = 0;
function startShowcaseAutoplay(){
  stopShowcaseAutoplay();
  showcaseTimer = setInterval(()=>{
    const el = document.getElementById('showcaseTrack');
    if (!el || Date.now() < showcasePausedUntil) return;
    const speed = siteData.sections.showcase.autoplaySpeed ?? 0.8;
    if (speed <= 0) return;
    if (el.dataset.loop === '1'){
      // Content is duplicated once (see renderShowcase), so wrapping at the
      // halfway point is invisible — the pixels at scrollLeft=0 and
      // scrollLeft=singleWidth are identical, giving a true seamless loop.
      const singleWidth = el.scrollWidth / 2;
      if (singleWidth <= el.clientWidth) return; // not enough content to loop meaningfully
      el.scrollLeft += speed;
      if (el.scrollLeft >= singleWidth) el.scrollLeft -= singleWidth;
    } else {
      // Admin view: single copy, so just restart at the beginning.
      const max = el.scrollWidth - el.clientWidth;
      if (max <= 0) return;
      if (el.scrollLeft >= max - 1) el.scrollLeft = 0;
      else el.scrollLeft += speed;
    }
  }, 20);
}
function stopShowcaseAutoplay(){ if (showcaseTimer) clearInterval(showcaseTimer); showcaseTimer = null; }
function bindShowcaseHover(){
  const el = document.getElementById('showcaseTrack');
  if (!el) return;
  el.addEventListener('mouseenter', ()=>{ showcasePausedUntil = Infinity; });
  el.addEventListener('mouseleave', ()=>{ showcasePausedUntil = 0; });
}
function nudgeShowcase(dir){
  const el = document.getElementById('showcaseTrack');
  if (el) el.scrollBy({left: dir*260, behavior:'smooth'});
  showcasePausedUntil = Date.now() + 2500; // brief pause so the manual nudge isn't immediately fought by autoplay
}

/* ---------------- GENERIC FIELD PATH RESOLVER ----------------
   Supports: plain.keys, array[byId], and array.byIndex — e.g.
   "bento.cards[b1].title" or "pricing.plans[pl2].features.0"
   Used by inline click-to-edit so one mechanism covers every field. */
function stepInto(obj, seg){
  const m = seg.match(/^(\w+)\[([\w-]+)\]$/);
  if (m) return obj[m[1]].find(x=>x.id===m[2]);
  if (/^\d+$/.test(seg)) return obj[Number(seg)];
  return obj[seg];
}
function resolveFieldPath(pathStr){
  const segs = pathStr.split('.');
  let obj = siteData.sections;
  for (let i=0;i<segs.length-1;i++) obj = stepInto(obj, segs[i]);
  return { parent: obj, key: segs[segs.length-1] };
}
function getFieldValue(pathStr){
  const {parent,key} = resolveFieldPath(pathStr);
  const val = parent[key];
  if (val && typeof val === 'object') return val[siteData.lang] || val.en || '';
  return val;
}
function setFieldValue(pathStr, newVal){
  const {parent,key} = resolveFieldPath(pathStr);
  const val = parent[key];
  if (val && typeof val === 'object') val[siteData.lang] = newVal;
  else parent[key] = newVal;
}

/* ---------------- UNDO HISTORY ---------------- */
let history = [];
function pushHistory(){
  history.push(JSON.stringify(siteData));
  if (history.length > 25) history.shift();
}
function undo(){
  if (!history.length) { alert('Nothing to undo yet.'); return; }
  siteData = JSON.parse(history.pop());
  saveLocal(); render();
}
function resetToDefault(){
  if (!confirm('Reset ALL content back to the ORIGINAL template — not just your last save, the very first starting content. This is rarely what you want; "Discard changes" (which undoes back to your last Save) is usually the right button. Continue with a full factory reset?')) return;
  pushHistory();
  siteData = JSON.parse(JSON.stringify(DEFAULT_DATA));
  hasUnsavedChanges = true;
  updateSaveButtonState();
  render();
}
function discardChanges(){
  if (!hasUnsavedChanges) { alert('Nothing to discard — there are no unsaved changes.'); return; }
  if (!confirm('Discard all changes since your last Save, and go back to what\'s currently live?')) return;
  siteData = JSON.parse(JSON.stringify(lastSavedSnapshot || DEFAULT_DATA));
  hasUnsavedChanges = false;
  updateSaveButtonState();
  render();
}

/* ---------------- INLINE CLICK-TO-EDIT (like Delusions) ----------------
   Click text directly -> type over it in place, no panel.
   Click the pencil -> full panel with style/size/hide/image controls.
   Both write to the same underlying data, so they never conflict. */
document.addEventListener('click', function(e){
  if (!canEdit()) return;
  if (e.target.closest('.edit-pencil')) return; // pencil handles its own click, opens the panel instead
  if (e.target.closest('#panel') || e.target.closest('.modal')) return;
  const target = e.target.closest('[data-editpath]');
  if (!target || target.isContentEditable) return;
  if (target.closest('a')) e.preventDefault(); // nav links/buttons/showcase captions can sit inside a real <a href> — without this, clicking to edit them also navigates
  beginInlineEdit(target);
});
function beginInlineEdit(el){
  pushHistory();
  const path = el.dataset.editpath;
  const pencil = el.querySelector('.edit-pencil');
  if (pencil) pencil.remove(); // must remove (not just hide) — textContent would otherwise include its "✎" character
  let cancelled = false;
  el.contentEditable = 'true';
  el.classList.add('inline-editing');
  el.focus();
  const range = document.createRange();
  range.selectNodeContents(el);
  const sel = window.getSelection();
  sel.removeAllRanges(); sel.addRange(range);

  function finish(){
    el.removeEventListener('blur', finish);
    el.removeEventListener('keydown', onKey);
    el.contentEditable = 'false';
    el.classList.remove('inline-editing');
    if (cancelled) {
      history.pop(); // nothing actually changed, discard the pending undo snapshot
      render(); // rebuild so the pencil icon etc. come back correctly
      return;
    }
    const text = el.textContent.trim();
    setFieldValue(path, text);
    saveLocal();
    render();
  }
  function onKey(ev){
    if (ev.key === 'Enter') { ev.preventDefault(); el.blur(); }
    if (ev.key === 'Escape') { cancelled = true; el.blur(); }
  }
  el.addEventListener('blur', finish);
  el.addEventListener('keydown', onKey);
}

/* ---------------- REORDER (Tier 1) ---------------- */
function getByPath(path){
  return path.split('.').reduce((o,k)=>o[k], siteData.sections);
}
function moveItem(listPath, id, dir){
  pushHistory();
  const list = getByPath(listPath);
  const sorted = [...list].sort((a,b)=>a.order-b.order);
  const idx = sorted.findIndex(x=>x.id===id);
  const swapIdx = idx+dir;
  if (swapIdx<0 || swapIdx>=sorted.length) { history.pop(); return; }
  const a = sorted[idx], b = sorted[swapIdx];
  const tmp = a.order; a.order = b.order; b.order = tmp;
  saveLocal(); render();
}

/* ---------------- HIDE / RESTORE ----------------
   ONE function walks the whole content tree for hidden things —
   used by the counter, the drawer, AND setHidden's section-level path,
   so there's no way for these to drift out of sync with each other. */
function getAllHideable(){
  const s = siteData.sections;
  const items = [];

  // whole sections (this was the missing case — hiding a whole section
  // via the gear icon used to be untrackable/unrestorable)
  Object.entries(s).forEach(([key, sec]) => {
    if (sec.hidden) items.push({label:'Whole section: '+key, unhide:()=>{sec.hidden=false;}});
  });

  // standard {text,style,hidden} fields
  const textFields = [
    ['Logo', s.header.logo], ['Hero eyebrow', s.hero.eyebrow], ['Hero headline', s.hero.h1], ['Hero lead paragraph', s.hero.lead],
    ['Showcase heading', s.showcase.heading],
    ['Bento heading', s.bento.heading], ['Bento subheading', s.bento.sub],
    ['Process heading', s.process.heading], ['Process subheading', s.process.sub],
    ['Pricing heading', s.pricing.heading], ['Reviews heading', s.reviews.heading], ['Footer text', s.footer.copy]
  ];
  textFields.forEach(([label, ref]) => { if (ref.hidden) items.push({label, unhide:()=>{ref.hidden=false;}}); });

  // list items
  s.header.navLinks.forEach(n=>{ if(n.hidden) items.push({label:'Nav link: '+t(n.text), unhide:()=>{n.hidden=false;}}); });
  s.strip.items.forEach(i=>{ if(i.hidden) items.push({label:'Stat: '+t(i.text).replace(/<[^>]+>/g,''), unhide:()=>{i.hidden=false;}}); });
  s.showcase.items.forEach(w=>{ if(w.hidden) items.push({label:'Work sample: '+t(w.caption), unhide:()=>{w.hidden=false;}}); });
  s.bento.cards.forEach(c=>{ if(c.hidden) items.push({label:'Card: '+t(c.title), unhide:()=>{c.hidden=false;}}); });
  s.process.steps.forEach(p=>{ if(p.hidden) items.push({label:'Step: '+t(p.title), unhide:()=>{p.hidden=false;}}); });
  s.pricing.plans.forEach(p=>{ if(p.hidden) items.push({label:'Plan: '+t(p.t), unhide:()=>{p.hidden=false;}}); });
  s.reviews.items.forEach(r=>{ if(r.hidden) items.push({label:'Review: '+t(r.name), unhide:()=>{r.hidden=false;}}); });

  return items;
}

function setHidden(kind, id, path, hidden){
  pushHistory();
  if (path){
    const parts = path.split('.');
    let obj = siteData.sections;
    for (let i=0;i<parts.length;i++) obj = obj[parts[i]];
    obj.hidden = hidden;
  } else {
    const map = {
      navlink: ()=>siteData.sections.header.navLinks.find(x=>x.id===id),
      stripItem: ()=>siteData.sections.strip.items.find(x=>x.id===id),
      showcaseItem: ()=>siteData.sections.showcase.items.find(x=>x.id===id),
      bentoCard: ()=>siteData.sections.bento.cards.find(x=>x.id===id),
      processStep: ()=>siteData.sections.process.steps.find(x=>x.id===id),
      plan: ()=>siteData.sections.pricing.plans.find(x=>x.id===id),
      review: ()=>siteData.sections.reviews.items.find(x=>x.id===id)
    };
    const item = map[kind] && map[kind]();
    if (item) item.hidden = hidden;
  }
  saveLocal(); render();
}

function updateHiddenCount(){
  document.getElementById('hiddenCount').textContent = getAllHideable().length;
}

function openHiddenDrawer(){
  const list = getAllHideable();
  document.getElementById('hiddenList').innerHTML = list.length
    ? list.map((item,i)=>`<div class="hidden-row"><span>${item.label}</span><button onclick="restoreRow(${i})">Restore</button></div>`).join('')
    : '<p style="color:var(--mute);font-size:13px;padding:10px 0;">Nothing hidden right now.</p>';
  window._hiddenListCache = list;
  document.getElementById('hidden-drawer').classList.add('open');
}
function restoreRow(i){
  pushHistory();
  window._hiddenListCache[i].unhide();
  saveLocal(); render(); openHiddenDrawer();
}

/* ---------------- EDIT PANEL ---------------- */
function bindPencils(){
  document.querySelectorAll('.editable').forEach(el=>{
    el.querySelector('.edit-pencil')?.addEventListener('click', (e)=>{
      e.preventDefault(); // pencil often sits inside a real <a href> — without this, clicking it also navigates
      e.stopPropagation();
      openPanelFor(el);
    });
  });
}

function openPanelFor(el){
  const kind = el.dataset.kind;
  const id = el.dataset.id;
  const path = el.dataset.path;
  currentEdit = {kind, id, path};
  const panel = document.getElementById('panel');

  if (kind === 'text'){
    const obj = getByPath(path);
    panel.innerHTML = textPanel(obj, path);
  } else if (kind === 'bentoCard'){
    const c = siteData.sections.bento.cards.find(x=>x.id===id);
    panel.innerHTML = bentoPanel(c);
  } else if (kind === 'plan'){
    const p = siteData.sections.pricing.plans.find(x=>x.id===id);
    panel.innerHTML = planPanel(p);
  } else if (kind === 'processStep'){
    const p = siteData.sections.process.steps.find(x=>x.id===id);
    panel.innerHTML = simpleTextGroupPanel(p, ['title','desc'], ()=>{p.hidden=true;});
  } else if (kind === 'review'){
    const r = siteData.sections.reviews.items.find(x=>x.id===id);
    panel.innerHTML = reviewPanel(r);
  } else if (kind === 'navlink' || kind === 'stripItem'){
    const list = kind==='navlink' ? siteData.sections.header.navLinks : siteData.sections.strip.items;
    const item = list.find(x=>x.id===id);
    panel.innerHTML = linkOrTextPanel(item, kind);
  } else if (kind === 'headerCta' || kind === 'heroCta'){
    panel.innerHTML = ctaPanel(kind);
  }

  document.getElementById('panel').classList.add('open');
  document.getElementById('panel-backdrop').classList.add('open');
}

function closePanel(){
  document.getElementById('panel').classList.remove('open');
  document.getElementById('panel-backdrop').classList.remove('open');
}

    <h4>Edit text</h4>
    <div class="sub">Editing language: ${langName(siteData.lang)}</div>
    <label>Content</label>
    <textarea id="f_text">${val}</textarea>
    <label>Font size (px)</label>
    <input type="range" id="f_size" min="11" max="80" value="${obj.style.size}" oninput="document.getElementById('f_sizeval').textContent=this.value">
    <div class="sub" id="f_sizeval">${obj.style.size}</div>
    <label>Style</label>
    <div class="toggle-group">
      <button id="f_bold" class="${obj.style.weight>=700?'on':''}" onclick="this.classList.toggle('on')">Bold</button>
      <button id="f_italic" class="${obj.style.italic?'on':''}" onclick="this.classList.toggle('on')">Italic</button>

    <input type="color" id="f_color" value="${obj.style.color}">

}

    <button class="go" style="margin-top:20px;" onclick="saveLinkOrText('${kind}','${item.id}')">Apply</button>
    <button class="danger" onclick="setHidden('${kind}','${item.id}',null,true); closePanel();">Remove (hide, keeps no space)</button>

function saveLinkOrText(kind, id){

}

function ctaPanel(kind){

  const textObj = isHeader ? siteData.sections.header.ctaText : siteData.sections.hero.ctaPrimary;
  const link = isHeader ? siteData.sections.header.ctaLink : siteData.sections.hero.ctaLink;
  return `
    <button class="close-panel" onclick="closePanel()">✕</button>
    <h4>Edit button</h4>
    <div class="sub">Editing language: ${langName(siteData.lang)}</div>
    <label>Button text</label>
    <input type="text" id="f_text" value="${textObj[siteData.lang]}">
    <label>Link URL</label>
    <input type="text" id="f_link" value="${link}">
    <button class="go" style="margin-top:20px;" onclick="saveCta('${kind}')">Apply</button>
  `;
}
function saveCta(kind){
  pushHistory();
  const isHeader = kind==='headerCta';
  const target = isHeader ? siteData.sections.header : siteData.sections.hero;
  const textField = isHeader ? 'ctaText' : 'ctaPrimary';
  target[textField][siteData.lang] = document.getElementById('f_text').value;
  target.ctaLink = document.getElementById('f_link').value;
  saveLocal(); render(); closePanel();
}

    </div>
    <label>Label</label>
    <input type="text" id="f_n" value="${c.n[siteData.lang]}">
    <label>Title</label>
    <input type="text" id="f_title" value="${c.title[siteData.lang]}">
    <label>Description</label>
    <textarea id="f_desc">${c.desc[siteData.lang]}</textarea>
    <label>Width (columns, of 6)</label>
    <select id="f_span">
      <option value="2" ${c.span===2?'selected':''}>Narrow (2)</option>
      <option value="3" ${c.span===3?'selected':''}>Medium (3)</option>
      <option value="4" ${c.span===4?'selected':''}>Wide (4)</option>
      <option value="6" ${c.span===6?'selected':''}>Full width (6)</option>
    </select>

    <input type="color" id="f_bg" value="${c.bg||'#F7F8F9'}">

    <input type="file" id="f_img" accept="image/*" onchange="previewImg(event)">

    <button class="go" style="margin-top:20px;" onclick="saveBento('${c.id}')">Apply</button>

function setCardIcon(key){
  const c = siteData.sections.bento.cards.find(x=>x.id===currentEdit.id);
  c.icon = key;
  document.getElementById('panel').innerHTML = bentoPanel(c);
  saveLocal();
}
function setCardTint(tint){
  const c = siteData.sections.bento.cards.find(x=>x.id===currentEdit.id);
  c.tint = tint;
  document.getElementById('panel').innerHTML = bentoPanel(c);
  render(); // live preview on the actual card, not just the panel (fix #5)
}
let _pendingImg = null;
function previewImg(e){
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{ _pendingImg = reader.result; document.getElementById('imgPrev').style.backgroundImage = `url(${_pendingImg})`; };
  reader.readAsDataURL(file);
}
function saveBento(id){
  pushHistory();
  const c = siteData.sections.bento.cards.find(x=>x.id===id);
  c.n[siteData.lang] = document.getElementById('f_n').value;
  c.title[siteData.lang] = document.getElementById('f_title').value;
  c.desc[siteData.lang] = document.getElementById('f_desc').value;
  c.span = parseInt(document.getElementById('f_span').value);
  c.bg = document.getElementById('f_bg').value;
  if (_pendingImg) { c.image = _pendingImg; _pendingImg = null; }
  saveLocal(); render(); closePanel();
}

function planPanel(p){
  const featureRows = p.features.map((f,i)=>`
    <div class="row" style="margin-bottom:6px; align-items:center;">
      <input type="text" class="feat-input" data-idx="${i}" value="${(f[siteData.lang]||'').replace(/"/g,'&quot;')}">
      <button type="button" onclick="removeFeature(${i})" style="flex:0 0 30px; border:1px solid var(--hair); background:var(--ink2); color:var(--paper); border-radius:6px; cursor:pointer;">✕</button>
    </div>`).join('');
  return `
    <button class="close-panel" onclick="closePanel()">✕</button>
    <h4>Edit plan</h4>
    <div class="sub">Editing language: ${langName(siteData.lang)}</div>
    <label>Plan name</label>
    <input type="text" id="f_t" value="${p.t[siteData.lang]}">
    <label>Price</label>
    <input type="text" id="f_price" value="${p.price}">
    <label>Featured (highlighted)</label>
    <div class="toggle-group"><button id="f_feat" class="${p.featured?'on':''}" onclick="this.classList.toggle('on')">Featured</button></div>
    <label>Feature list</label>
    <div id="featureRows">${featureRows}</div>
    <button type="button" onclick="addFeature()" style="width:100%;padding:9px;border:1px dashed var(--hair);border-radius:6px;background:none;cursor:pointer;font-size:12.5px;color:var(--mute);">+ Add feature line</button>
    <button class="go" style="margin-top:20px;" onclick="savePlan('${p.id}')">Apply</button>
    <button class="danger" onclick="setHidden('plan','${p.id}',null,true); closePanel();">Remove (hide, keeps no space)</button>
  `;
}
function addFeature(){
  const p = siteData.sections.pricing.plans.find(x=>x.id===currentEdit.id);
  p.features.push({en:'New feature',et:'',ru:'',sv:''});
  document.getElementById('panel').innerHTML = planPanel(p); // refresh panel only, no full site re-render needed
}
function removeFeature(idx){
  const p = siteData.sections.pricing.plans.find(x=>x.id===currentEdit.id);
  p.features.splice(idx,1);
  document.getElementById('panel').innerHTML = planPanel(p);
}
function savePlan(id){
  pushHistory();
  const p = siteData.sections.pricing.plans.find(x=>x.id===id);
  p.t[siteData.lang] = document.getElementById('f_t').value;
  p.price = document.getElementById('f_price').value;
  p.featured = document.getElementById('f_feat').classList.contains('on');
  document.querySelectorAll('.feat-input').forEach(inp=>{
    const idx = parseInt(inp.dataset.idx);
    if (p.features[idx]) p.features[idx][siteData.lang] = inp.value;
  });
  saveLocal(); render(); closePanel();
}

  return `

      <input type="color" value="${obj.tint&&obj.tint!=='none'?obj.tint:'#35414F'}" oninput="setStepTint(this.value)" style="width:30px;height:26px;padding:0;border:1px solid var(--hair);border-radius:6px;cursor:pointer;">

  `;

function saveProcessStep(id){
  pushHistory();
  const p = siteData.sections.process.steps.find(x=>x.id===id);
  p.title[siteData.lang] = document.getElementById('f_title').value;
  p.desc[siteData.lang] = document.getElementById('f_desc').value;

function saveTextPanel(path){

  const obj = getByPath(path);
  obj.text[siteData.lang] = document.getElementById('f_text').value;

      <div style="flex:1; padding:9px 10px; border:1px solid var(--hair); border-radius:6px; font-size:13px; ${n.hidden?'opacity:.4;':''}">${t(n.text)}${n.hidden?' (hidden)':''}</div>

  ` : '';

    <label>Auto-scroll speed</label>
    <input type="range" min="0" max="3" step="0.1" value="${s.autoplaySpeed}" oninput="document.getElementById('spval').textContent=this.value; siteData.sections.showcase.autoplaySpeed=parseFloat(this.value);" id="f_speed">

  document.getElementById('panel').classList.add('open');

function addNavLink(){
  pushHistory();
  const nav = siteData.sections.header.navLinks;
  const id = 'nav'+Date.now();
  nav.push({id, text:{en:'New link',et:'Uus link',ru:'Новая ссылка',sv:'Ny länk'}, link:'#', hidden:false});
  saveLocal(); render(); openSectionPanel('header');
}
function removeNavLink(id){
  pushHistory();
  const nav = siteData.sections.header.navLinks;
  const item = nav.find(x=>x.id===id);
  if (item) item.hidden = true;
  saveLocal(); render(); openSectionPanel('header');
}
let _pendingHeroImg = null;
function previewHeroImg(e){
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{ _pendingHeroImg = reader.result; document.getElementById('heroImgPrev').style.backgroundImage = `url(${_pendingHeroImg})`; };
  reader.readAsDataURL(file);
}
function resetHeroVisual(){
  pushHistory();
  siteData.sections.hero.visual.image = null;
  saveLocal(); render(); openSectionPanel('hero');
}
function saveSectionSpacing(key){
  pushHistory();
  const s = siteData.sections[key];
  s.margin.mt = parseInt(document.getElementById('f_mt').value);
  s.margin.mb = parseInt(document.getElementById('f_mb').value);
  if (key === 'hero'){
    if (_pendingHeroImg) { s.visual.image = _pendingHeroImg; _pendingHeroImg = null; }
    s.visual.height = parseInt(document.getElementById('f_hh').value);
  }
  if (key === 'showcase'){
    s.autoplaySpeed = parseFloat(document.getElementById('f_speed').value);
  }
  saveLocal(); render(); closePanel();
}

/* ---------------- PUBLISH ---------------- */
function openPublish(){
  document.getElementById('publishJson').textContent = JSON.stringify(siteData, null, 2);
  openModal('publish-modal');
}
async function confirmPublish(){
  const btn = document.querySelector('#publish-modal .go');
  const errEl = document.getElementById('publishError');
  if (errEl) errEl.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Saving…';
  try {
    await savePageContent('home', siteData);
    lastSavedSnapshot = JSON.parse(JSON.stringify(siteData));
    hasUnsavedChanges = false;
    updateSaveButtonState();
    closeModal('publish-modal');
    alert('Saved — this is now live for every visitor.');
  } catch (err) {
    console.error(err);
    if (errEl) { errEl.textContent = 'Save failed: ' + err.message; errEl.style.display = 'block'; }
    else alert('Save failed: ' + err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Save — goes live for everyone';
  }
}

/* ---------------- SUPABASE CONTENT STORE (fix #1) ----------------
   The CMS's actual published state now lives in the `page_content` table,
   not this browser's local storage — every visitor loads the same content
   an admin last saved. DEFAULT_DATA is only ever used as a first-run
   fallback before anything has been saved for the first time. */
let cachedSiteId = null;
async function getSiteId(){
  if (cachedSiteId) return cachedSiteId;
  const { data, error } = await supabase.from('sites').select('id').eq('slug','fieldnote').maybeSingle();
  if (error) { console.error(error); return null; }
  if (!data) { console.warn("No 'fieldnote' row in the sites table yet — run: insert into sites (slug) values ('fieldnote');"); return null; }
  cachedSiteId = data.id;
  return cachedSiteId;
}
async function loadPageContent(pageSlug){
  const siteId = await getSiteId();
  if (!siteId) return null;
  const { data, error } = await supabase.from('page_content').select('content').eq('site_id', siteId).eq('page_slug', pageSlug).maybeSingle();
  if (error) { console.error(error); return null; }
  return data ? data.content : null;
}
async function savePageContent(pageSlug, content){
  const siteId = await getSiteId();
  if (!siteId) throw new Error("Site not found in Supabase. Run: insert into sites (slug) values ('fieldnote');");
  const { error } = await supabase.from('page_content').upsert(
    { site_id: siteId, page_slug: pageSlug, content, updated_at: new Date().toISOString() },
    { onConflict: 'site_id,page_slug' }
  );
  if (error) throw error;
}

/* ---------------- INIT ---------------- */
(async function initAuth(){
  const clientMod = await import('./shared/supabaseClient.js?v3');
  const authMod = await import('./shared/auth.js?v3');
  themeMod = await import('./shared/theme.js?v3');
  analyticsMod = await import('./shared/analytics.js?v3');
  const chatMod = await import('./shared/chat.js?v3');
  supabase = clientMod.supabase;
  checkIsAdmin = authMod.isAdmin;

  // Load the real published content — this runs for every visitor, not just
  // admins, since this is what makes the site show the same thing to everyone.
  try {
    const published = await loadPageContent('home');
    if (published) {
      siteData = published;
      lastSavedSnapshot = JSON.parse(JSON.stringify(published));
    } else {
      lastSavedSnapshot = JSON.parse(JSON.stringify(DEFAULT_DATA)); // nothing saved yet — DEFAULT_DATA is standing in as "last saved"
    }
  } catch (err) {
    console.error('Could not load published content, showing defaults instead:', err);
    lastSavedSnapshot = JSON.parse(JSON.stringify(DEFAULT_DATA));
  }

  const { data: { user } } = await supabase.auth.getUser();
  currentUser = user || null;
  if (currentUser) {
    isAdmin = await checkIsAdmin(currentUser.id);
    if (isAdmin) {
      document.body.classList.add('admin');
      document.body.classList.add('edit-mode');
      document.getElementById('adminbar').classList.add('on');
    }
  }
  if (!isAdmin) {
    analyticsMod.trackPageview('index.html');
    analyticsMod.trackScrollDepth('index.html');
    chatMod.mountChatWidget();
  }
  analyticsMod.initLoginTracking();
  render();
})();
</script>
